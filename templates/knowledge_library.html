<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f9fa">
  <title>知识库 · Second Brain</title>
  <link rel="stylesheet" href="/assets/knowledge.css?v={{ asset_version }}">
  <script src="/assets/theme.js?v={{ asset_version }}" defer></script>
  <script src="/assets/library.js?v={{ asset_version }}" defer></script>
</head>
<body class="library-page">
  <div class="app-layout">
    <aside class="sidebar" aria-label="知识库导航">
      <a class="brand" href="/" aria-label="Second Brain 首页">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-type">SECOND<br>BRAIN</span>
      </a>
      <div class="sidebar-group">
        <div class="sidebar-caption">WORKSPACE <span>01</span></div>
        <a class="side-link active" href="/" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
          <span>文章资料库</span>
          <span class="side-count" id="sidebar-count">—</span>
        </a>
      </div>
      <div class="sidebar-group filter-group">
        <label class="sidebar-caption" for="tag-filter">POPULAR TAGS</label>
        <select id="tag-filter" class="tag-filter" aria-label="按标签筛选">
          <option value="">全部文章</option>
        </select>
      </div>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-note">
        <span class="note-symbol" aria-hidden="true">✳</span>
        <p>每一条想法，<br>都值得被再次发现。</p>
      </div>
      <div class="sidebar-footer"><span class="private-dot"></span> 私人知识空间</div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div class="breadcrumb">工作台 <span>/</span> <strong>文章资料库</strong></div>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换深色模式">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span class="theme-label">深色模式</span>
        </button>
      </div>

      <section class="library-hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <div class="hero-kicker"><span class="kicker-line"></span> PERSONAL KNOWLEDGE LIBRARY</div>
          <h1 id="page-title">让好内容，<br><span>有处可寻。</span></h1>
          <p>查找、阅读和整理你收藏的每一篇文章。</p>
          <span class="hero-pill"><span class="private-dot"></span> 随时回到重要的想法</span>
        </div>
        <div class="hero-art" aria-hidden="true">
          <span class="art-plane art-plane-one"></span>
          <span class="art-plane art-plane-two"></span>
          <span class="art-plane art-plane-three"></span>
          <span class="art-orbit"></span>
        </div>
      </section>

      <section class="library-section" aria-labelledby="articles-title">
        <div class="section-topline"><span>YOUR COLLECTION</span><span>001 — LIBRARY</span></div>
        <div class="section-header">
          <div>
            <h2 id="articles-title">全部文章</h2>
            <p id="count" class="section-subtitle">正在读取你的资料库…</p>
          </div>
          <label class="search-field" for="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
            <input id="search" type="search" placeholder="搜索标题或摘要" autocomplete="off">
          </label>
        </div>
        <div id="filter-summary" class="filter-summary" hidden></div>
        <p id="message" class="message" role="status">加载中…</p>
        <div id="articles" class="article-grid"></div>
        <button id="more" class="more-button" type="button" hidden>加载更多文章 <span aria-hidden="true">↗</span></button>
      </section>
    </main>
  </div>
</body>
</html>
